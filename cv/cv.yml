summary: >
  Backend & DevOps engineer with 3+ years building and operating scalable,
  low-latency systems for remote-first products. Comfortable end to end across
  the stack — Python and TypeScript services, real-time WebSocket servers,
  Kubernetes, Terraform, and Grafana/Prometheus/Loki observability.

work:
  - organization: Bhoos Games
    url: "bhoos.com"
    location: Remote
    positions:
      - position: DevOps / Backend Developer
        startDate: 2024-01-01
        endDate: "present"
        highlights:
          - Built the backend for real-time multiplayer board games on WebSocket servers, load-tested and tuned to sustain sub 100ms p99 latency at 10k concurrent connections.
          - Deployed and operate a Grafana, Prometheus, and Loki observability stack, across 3 game backends, implemented proactive alerting on p95/p99 query latency, enabling issue detection within minutes rather than user-reported incidents.
          - Engineered core backend framework in TypeScript/Node.js to provide unified-API for games and servers that runs as either a remote server or a local in-process API via transparent proxying.
          - Built an end-to-end-encrypted, local-first payroll accounting backend with sync semantics inspired by the Signal protocol.
          - Automated server provisioning, deployments, and CI/CD pipelines, reducing release time from \~40 minutes to \~2 minutes.
  - organization: Docsumo
    url: "docsumo.com"
    location: Remote
    positions:
      - position: Python Developer
        startDate: 2023-04-01
        endDate: 2024-01-01
        highlights:
          - Developed a disaster recovery automation script to streamline recovery procedures and improve operational resilience.
          - Built an API performance monitoring tool to track endpoint performance and identify potential bottlenecks.
          - Built Terraform-based infrastructure to provision ephemeral, isolated per-developer environments, eliminating shared-cluster conflicts and reducing testing iteration time by an estimated 40–50%.
          - Deployed and operated micro-services on Kubernetes with Celery for distributed, asynchronous document processing.
          - Redesigned the logging and tracing infrastructure to enable end-to-end request tracing across services and follow an action through its entire lifecycle.
          - Investigated recurring production outages caused by Redis saturation and lack of failover, and implemented a Redis Sentinel-based architecture to improve high availability and prevent cache-related downtime.

