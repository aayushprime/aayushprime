markup:
  highlight:
    anchorLineNos: false
    codeFences: true
    guessSyntax: false
    hl_Lines: ''
    lineAnchors: ''
    lineNoStart: 1
    lineNos: true
    lineNumbersInTable: true
    # noClasses: false emits Chroma token classes instead of inline styles, so
    # assets/css/chroma.css can theme them per light/dark. See STYLE-GUIDE §14.2.
    noClasses: false
    tabWidth: 4
# layouts/llms.txt ships with the theme but renders only if the output format
# is registered and added to the home page's outputs.
outputFormats:
  llms:
    mediaType: text/plain
    baseName: llms
    isPlainText: true

outputs:
  home:
  - HTML
  - RSS
  - JSON       # is necessary
  - llms
