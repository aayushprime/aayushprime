baseurl: https://lamichhaneaayush.com.np/
languageCode: en-us
title: aayushprime
# Renders layouts/robots.txt. Without this Hugo emits no robots.txt at all.
enableRobotsTXT: true

languages:
  en:
    languageName: English
    weight: 1
    menu:
      main:
      - name: Search
        url: search/
        weight: 40
      - name: Blog
        url: posts/
        weight: 30
      - name: About
        url: about/
        weight: 20
      - name: CV
        url: cv/
        weight: 10
      - name: GitHub
        url: https://github.com/aayushprime
        weight: 2

